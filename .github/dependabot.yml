version: 2
updates:
  - { package-ecosystem: gomod, directory: /services/gateway, schedule: { interval: weekly } }
  - { package-ecosystem: cargo, directory: /, schedule: { interval: weekly } }
  - { package-ecosystem: npm, directory: /, schedule: { interval: weekly }, groups: { npm-minor: { update-types: [minor, patch] } } }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /docker, schedule: { interval: weekly } }
