name: Release
# feature → PR → main. release-please reads Conventional Commits on main, opens/updates a
# "release PR" (semver bump + CHANGELOG.md); merging it tags the release and triggers publishing.
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write
  attestations: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: gateway, file: docker/gateway.Dockerfile }
          - { image: chainsim, file: docker/gateway.Dockerfile, args: "BIN=chainsim" }
          - { image: signer, file: docker/signer.Dockerfile }
          - { image: engine, file: docker/engine.Dockerfile }
          - { image: web, file: docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Sigstore build-provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  binaries:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@v5
        with: { go-version-file: services/gateway/go.mod }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - run: npx nx run-many -t build
      - run: |
          mkdir -p out && cp dist/go/* target/release/signer out/ && tar -C apps/web -czf out/web-dist.tgz dist
          (cd out && sha256sum * > SHA256SUMS)
      - uses: actions/attest-build-provenance@v4
        with: { subject-path: "out/*" }
      - run: gh release upload "${{ needs.release-please.outputs.tag }}" out/* --clobber
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
