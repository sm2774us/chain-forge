name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  NX_NO_CLOUD: "true"
jobs:
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: commitlint config regression test (bots pass, humans must follow Conventional Commits)
        run: bash tools/test-commitlint.sh
      - name: Conventional-commit check on PR commits
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: services/gateway/go.mod, cache-dependency-path: services/gateway/go.mod }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: stable, components: "clippy, rustfmt, llvm-tools-preview" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Actions are SHA-pinned (no tag can vanish or be hijacked)
        run: bash tools/verify-actions.sh
      - run: npm ci --ignore-scripts
      - name: Nx affected — lint, test, coverage (100% gates), build
        run: npx nx affected -t lint test coverage build --parallel=3
      - name: Go ↔ Rust interop (real gateway client against the real engine binary)
        run: npx nx run engine:interop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: web-coverage, path: apps/web/coverage, if-no-files-found: ignore }

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Boot the real stack (chainsim + Go gateway + Rust signer + web)
        run: docker compose up -d --build --wait --wait-timeout 300 || (docker compose logs; exit 1)
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx nx run web:e2e
        env:
          E2E_BASE_URL: http://localhost:8088
          E2E_API_KEY: dev-key-change-me
      - if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: { name: e2e-report, path: "apps/web/playwright-report\ncompose.log", if-no-files-found: ignore }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (vulns, secrets, IaC misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true, scanners: "vuln,secret,misconfig" }

  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      - run: tofu -chdir=infra/tofu init -backend=false && tofu -chdir=infra/tofu fmt -check && tofu -chdir=infra/tofu validate

  gate:
    if: always()
    needs: [verify, e2e, security, tofu]
    runs-on: ubuntu-latest
    steps:
      - name: Required-check aggregator (make this the only required status in branch protection)
        run: |
          [ "${{ contains(needs.*.result, 'failure') }}" = "false" ] && [ "${{ contains(needs.*.result, 'cancelled') }}" = "false" ]
