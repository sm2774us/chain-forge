[package]
name = "chaincore"
description = "Ethereum-compatible primitives: Keccak-256, EIP-55, EIP-191, RLP, EIP-155 signing"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "std"] }
sha3 = "0.10"
hex = "0.4"
zeroize = "1"
thiserror = "1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
