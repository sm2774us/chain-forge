[package]
name = "engine"
description = "Pre-trade simulation core: revm over gRPC (mTLS or Unix socket). Holds no keys."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version = "1.85"

[lib]
name = "engine_service"
path = "src/lib.rs"

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
revm = { version = "14", default-features = false, features = ["std", "serde"] }
tonic = { version = "0.12", features = ["tls"] }
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
hex = "0.4"
serde_json = "1"
tower = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }

[lints]
workspace = true
