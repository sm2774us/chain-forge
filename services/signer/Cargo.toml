[package]
name = "signer"
description = "Custody signing service: keys never leave this process; HMAC-authenticated, audited, policy-checked"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "signer_service"
path = "src/lib.rs"

[[bin]]
name = "signer"
path = "src/main.rs"

[dependencies]
chaincore = { path = "../../crates/chaincore" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
zeroize = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
